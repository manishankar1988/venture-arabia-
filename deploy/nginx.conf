# Nginx in front of Gunicorn. Works both inside docker-compose (upstream "web")
# and on a plain server (change the upstream to 127.0.0.1:8000 and the paths).
# Replace venturearabia.qa with the real domain.

upstream venture_app {
    server web:8000;
}

server {
    listen 80;
    server_name venturearabia.qa www.venturearabia.qa;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name venturearabia.qa www.venturearabia.qa;

    ssl_certificate     /etc/letsencrypt/live/venturearabia.qa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venturearabia.qa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 6M;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /srv/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location /media/ {
        alias /srv/media/;
        expires 30d;
    }

    location / {
        proxy_pass http://venture_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
