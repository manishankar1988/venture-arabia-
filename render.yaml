# Render.com blueprint: gives the site a public URL (https://venture-arabia.onrender.com)
# straight from the GitHub repository.
#
#   1. Push this repo to GitHub.
#   2. On https://dashboard.render.com  ->  New  ->  Blueprint  ->  select the repo  ->  Apply.
#   3. The first start seeds the catalogue and creates the admin user automatically
#      (bootstrap_site). Find the generated admin password in the service's
#      Environment tab (DJANGO_SUPERUSER_PASSWORD) and change it after the first login.
#   4. Admin panel:  https://<your-service>.onrender.com/manage/   (user: admin)
#
# Notes: the free web service sleeps after 15 minutes idle and its disk is reset on every
# deploy, so photos uploaded through the admin need the paid persistent disk (or keep
# adding them to media/ in git). The free PostgreSQL instance expires after 30 days
# unless upgraded. Set ADMIN_URL to something private in the dashboard before launch.

databases:
  - name: venture-arabia-db
    plan: free
    region: frankfurt   # must match the web service region for the internal connection string
    databaseName: venture
    user: venture

services:
  - type: web
    name: venture-arabia
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # migrations run at start (the database is only reachable from the running service, not the build)
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_site && gunicorn venture.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: ADMIN_URL
        value: "manage/"
      - key: DATABASE_URL
        fromDatabase:
          name: venture-arabia-db
          property: connectionString
      - key: DB_SSLMODE
        value: "prefer"
      - key: BEHIND_PROXY
        value: "1"
      - key: FORCE_HTTPS
        value: "0"
      - key: SERVE_MEDIA
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "venture@venture.com.qa"
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: DEFAULT_FROM_EMAIL
        value: "Venture Arabia <venture@venture.com.qa>"
      - key: ORDER_NOTIFICATION_EMAIL
        value: "venture@venture.com.qa"
