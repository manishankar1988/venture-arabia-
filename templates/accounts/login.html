{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="container section">
  <div class="narrow auth-card">
    <h1>Log in</h1>
    <p class="muted">Use the email address and password you registered with.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-error" style="margin-bottom:1rem">{{ form.non_field_errors }}</div>{% endif %}
      <div class="form-row"><label for="id_username">Email</label><input type="email" name="username" id="id_username" autocomplete="username" required autofocus></div>
      <div class="form-row"><label for="id_password">Password</label><input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-block">Log in</button>
    </form>
    <p class="small" style="margin-top:1rem;text-align:center"><a href="{% url 'accounts:password_reset' %}">Forgotten your password?</a> · <a href="{% url 'accounts:register' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
