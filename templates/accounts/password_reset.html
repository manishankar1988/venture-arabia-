{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="container section"><div class="narrow auth-card">
  <h1>Reset your password</h1>
  <p class="muted">Enter your email address and we will send you a link to choose a new password.</p>
  <form method="post" novalidate>{% csrf_token %}{% include "_form_fields.html" with form=form %}<button type="submit" class="btn btn-block">Send reset link</button></form>
</div></div>
{% endblock %}
